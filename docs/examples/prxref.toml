# .prxref.toml - repository config for prxref (issue #38)
#
# Copy this file to the root of your repository as .prxref.toml. prxref reads
# it from the working directory, so run prxref from the repository root.
#
# Keys are the PRXREF_* environment variable names, lowercased, without the
# prefix. The pipeline's environment and command-line flags still win over
# every value here. Credentials, endpoints (llm_base_url), the backend, and
# the gate (fail_on, dry_run) cannot be set in this file; keep them in the
# pipeline.
#
# Validate before committing:  prxref config check
# Schema and every key:         docs/config-file.md

# --- Rules -------------------------------------------------------------------
# Paths are relative to THIS file's directory and must stay inside it.

# The team checklist every review unit reads.
review_rules = ".prxref/rules.md"

# Rules that reach only the files their applies_to globs match: a file per
# area, or a directory read one level deep for *.md files.
scoped_rules = [".prxref/rules/java.md", ".prxref/rules/helm"]

# At most this many findings per team rule; 0 turns the cap off.
max_findings_per_rule = 2

# --- Model chain -------------------------------------------------------------
# Tried in order, cheapest first. The endpoint and its key stay in the
# pipeline (PRXREF_LLM_BASE_URL, PRXREF_LLM_API_KEY).

llm_models = ["z-ai/glm-5.3-flash", "openai/gpt-4o-mini"]
llm_reasoning_effort = "low"
llm_max_tokens = 8192
llm_timeout = 60.0
# Quoted, so every prxref release that reads this file accepts it.
llm_temperature = "0.0"

# --- Context -----------------------------------------------------------------
# off | diff | repo. "diff" adds definitions from the PR's own changed files.

repo_context = "diff"
repo_context_max_chars = 12000
chunk_context_lines = 5
context_exclude_globs = ["**/fixtures/**", "**/*.snap"]

# In-repo standards (#68): the repository's own standards documents whose
# sections ride chunk prompts at repo_context = "repo". This REPLACES the
# built-in set (empty/unset keeps it); the exact value off, set only through
# the environment, turns them off.
context_standards_globs = ["docs/standards/**", "docs/adr/**", "SECURITY.md"]
# Standards characters one chunk worker receives.
context_standards_max_chars = 4000

# --- Comment policy ----------------------------------------------------------

# summary+inline | summary | inline
post_mode = "summary+inline"
max_inline_comments = 10
post_verdict = true
group_findings = true
suggestions = "on"
# Finding glyphs and the bullet separator (#59). Unset keeps the defaults.
# severity_markers = "error=🔴,warning=🟡"
# summary_bullet_separator = ": "

# --- Noise and size ----------------------------------------------------------

confidence_floor = 0.7
max_error_findings = 5
max_warning_findings = 10
size_warn_lines = 800
size_ignore_globs = ["docs/generated/**"]

# --- PR metadata rules (#70) -------------------------------------------------
# Flat keys — the config file is flat, so a [metadata] table is an error.
# "on" runs only the checks their own keys configure.

metadata_rules = "on"
# type=regex: the WHOLE source branch must match the PR type's pattern
# (fullmatch, so fix=fix/.* fits fix/42). The type comes from the PR's
# labels first, else the title's conventional-commit prefix ("fix: ..." ->
# fix); an unresolved type is skipped, not flagged.
branch_patterns = ["fix=fix/.*", "feature=feature/.*"]
# Every non-merge commit subject must contain this; needs the forge's
# commit listing (GitHub, Gitea), else the check skips itself.
commit_reference = "ACME-[0-9]+"
# name=glob areas; more than max_areas_per_pr distinct areas is flagged.
area_globs = ["backend=src/**", "frontend=web/**"]
max_areas_per_pr = 2

# --- CI wiring (#66) ---------------------------------------------------------
# "on" flags a check-shaped file the PR adds (a verify/smoke/check script
# or flag, a gained shebang, a test file outside the runner's default
# include) that no CI configuration file invokes. Needs the forge's
# head-sha file reads or --repo-dir. Off by default.

ci_wiring = "on"
# Globs REPLACING the built-in CI-file set (empty/unset keeps it); at most
# 12 CI files are read per run.
ci_wiring_globs = [".github/workflows/*.y*ml", ".gitlab-ci.yml", "Jenkinsfile"]

# --- Execution evidence (#69) ------------------------------------------------
# Command outputs from running this PR locally, shown to review units as
# trusted context. JSON or plain text; see docs/env-vars.md.

evidence_files = [".prxref/evidence/run.json"]
# Evidence characters one review unit receives; 0 turns the block off.
evidence_max_chunk_chars = 4000

# --- Stable finding ids (#71) ---------------------------------------------------
# true stamps every finding with a content-derived id (file#rule#12-hex claim
# hash) that survives reworded titles and anchor drift; false
# never runs the pass and every id stays null. See docs/env-vars.md.

# stable_ids = false
# JSON verdict store earlier runs' refuted verdicts are read from, keyed by
# stable id; the review reads it and never writes it. Read unless
# stable_ids = false. Missing reads as empty; malformed is a configuration
# error. Path relative to THIS file's directory.
# verdict_store = ".prxref/verdicts.json"

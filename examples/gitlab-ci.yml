# Example GitLab CI/CD configuration for reviewing Merge Requests with prxref.
#
# GitLab CI provides $CI_PROJECT_URL and $CI_MERGE_REQUEST_IID for MR pipelines.
#
# Authentication:
#   Configure PRXREF_GITLAB_TOKEN (Project/Group Access Token with api or read_api/read_repository/create_commit_status)
#   in Settings > CI/CD > Variables (masked).
#
# LLM configuration:
#   Configure PRXREF_LLM_BASE_URL and PRXREF_LLM_API_KEY in CI/CD Variables.

stages:
  - review

prxref-review:
  stage: review
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  variables:
    PRXREF_LLM_MODELS: "flash,orch"
  before_script:
    - pip install --no-cache-dir prxref
  script:
    - |
      MR_URL="${CI_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
      prxref review --pr-url "$MR_URL" -v

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Scoped deploy identity for the prxref gate stack. Deploy once as an admin; afterwards
  `sam deploy` runs as the deployer role, and CloudFormation acts as the exec role. Both are
  scoped to resources CloudFormation names after the stack, which must be named prxref-gate.
  See deploy/aws/README.md.

Parameters:
  GateStackName:
    Type: String
    Default: prxref-gate
    AllowedValues: [prxref-gate]
    Description: The gate stack's name. Every scope below derives from it.
  DeployerUserName:
    Type: String
    Default: prxref-deployer
    Description: IAM user allowed to assume the deployer role (console sign-in, no access keys).

Resources:
  # -- artifacts ----------------------------------------------------------------
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref GateStackName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${GateStackName}-*

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${GateStackName}-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: 30

  # -- the most a function role in the gate stack can ever do --------------------
  FunctionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${GateStackName}-function-boundary
      Description: Permissions boundary every gate function role must carry.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${GateStackName}-*
          - Sid: Table
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GateStackName}-*
          - Sid: Queue
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${GateStackName}-*
          - Sid: Secrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GateStackName}/*
          - Sid: Bedrock
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*

  # -- CloudFormation acts as this role -------------------------------------------
  ExecRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          # apigateway:TagResource is real (CloudFormation tags HTTP API stages) but missing
          # from cfn-lint's action list.
          ignore_checks: [W3037]
    Properties:
      RoleName: !Sub ${GateStackName}-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gate-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${GateStackName}-*
              - Sid: CreateMapping
                Effect: Allow
                Action: lambda:CreateEventSourceMapping
                Resource: "*"
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${GateStackName}-*
              - Sid: Mappings
                Effect: Allow
                Action:
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
              # Lambda checks a mapping before CloudFormation knows its id.
              - Sid: ListMappings
                Effect: Allow
                Action:
                  - lambda:ListEventSourceMappings
                  - lambda:GetEventSourceMapping
                Resource: "*"
              - Sid: RolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GateStackName}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref FunctionBoundary
              - Sid: Roles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GateStackName}-*
              - Sid: PassToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GateStackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: KeepBoundary
                Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                  - iam:PutRolePermissionsBoundary
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:DeletePolicy
                Resource: "*"
              - Sid: Queues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${GateStackName}-*
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GateStackName}-*
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${GateStackName}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${GateStackName}-*:*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Schedule
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${GateStackName}-*
              # HTTP API ids are random, so this one is region-wide.
              - Sid: HttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: Image
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:GetRepositoryPolicy
                Resource: !GetAtt ImageRepository.Arn

  # -- the identity that runs `sam deploy` -------------------------------------------
  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GateStackName}-deployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt DeployerUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-gate-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ChangeStackAsExecRole
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GateStackName}/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt ExecRole.Arn
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GateStackName}/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: Templates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: PassExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: ReadLogs
                Effect: Allow
                Action:
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:StartLiveTail
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${GateStackName}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${GateStackName}-*:*
              - Sid: ListLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: InspectQueues
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${GateStackName}-*

  # -- a person signs in as this user, then assumes the deployer role -------------------
  DeployerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref DeployerUserName
      Policies:
        - PolicyName: assume-deployer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GateStackName}-deployer
              - Sid: CliLogin
                Effect: Allow
                Action:
                  - signin:AuthorizeOAuth2Access
                  - signin:CreateOAuth2Token
                Resource: "*"
              - Sid: OwnPassword
                Effect: Allow
                Action:
                  - iam:ChangePassword
                  - iam:GetUser
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${DeployerUserName}

Outputs:
  ExecRoleArn:
    Description: Pass to `sam deploy --role-arn`.
    Value: !GetAtt ExecRole.Arn
  DeployerRoleArn:
    Description: role_arn of the deploy profile.
    Value: !GetAtt DeployerRole.Arn
  FunctionBoundaryArn:
    Description: Pass to the gate stack as PermissionsBoundaryArn.
    Value: !Ref FunctionBoundary
  ImageRepositoryUri:
    Description: Pass to `sam deploy --image-repository`.
    Value: !GetAtt ImageRepository.RepositoryUri
  ArtifactBucketName:
    Description: Pass to `sam deploy --s3-bucket`.
    Value: !Ref ArtifactBucket

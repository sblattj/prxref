name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true


  publish:
    name: publish-to-pypi
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/prxref
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      # Authentication is OIDC trusted publishing — no API token is stored anywhere.
      # Requires a pending publisher on pypi.org: project prxref, owner sblattj,
      # repository prxref, workflow release.yml, environment pypi.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

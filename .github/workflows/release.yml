name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # TODO: PyPI trusted publishing
      # PyPI publishing is deliberately not configured yet because there are no secrets / trusted publishing OIDC bindings in this repository.
      # When ready, configure trusted publishing on PyPI and add pypa/gh-action-pypi-publish (with id-token: write permissions).

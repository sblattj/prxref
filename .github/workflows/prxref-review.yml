name: prxref review

# pull_request_target runs in the BASE repository context, so it has access to
# secrets and a write token even for fork PRs. That is only safe because we
# never check out or execute the pull request's code: prxref fetches the diff
# over the GitHub API from the PR URL alone.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: prxref review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # prxref is non-blocking by design (exits 0 on all network/LLM/forge errors),
    # but continue-on-error provides belt-and-braces protection for CI continuity.
    continue-on-error: true

    steps:
      - name: Checkout base ref (never the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install prxref from the base checkout
        # NOT `uv pip install --system .`. The runner's system interpreter is
        # PEP 668 externally-managed, so uv refuses it outright ("The
        # interpreter at /usr is externally managed", exit 2), and --system
        # additionally tells uv to ignore the virtualenv setup-uv provisions.
        # Install into an explicit venv and invoke it by path instead.
        run: |
          # setup-uv with python-version set already creates .venv and exports
          # VIRTUAL_ENV, so an unconditional `uv venv` fails with "a virtual
          # environment already exists". Only create one if it is missing.
          [ -d .venv ] || uv venv
          uv pip install .

      - name: Run prxref review
        env:
          PRXREF_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRXREF_LLM_BACKEND: http
          PRXREF_LLM_BASE_URL: ${{ vars.PRXREF_LLM_BASE_URL }}
          PRXREF_LLM_API_KEY: ${{ secrets.PRXREF_LLM_API_KEY }}
          PRXREF_LLM_MODELS: ${{ vars.PRXREF_LLM_MODELS }}
          PRXREF_LLM_REASONING_EFFORT: ${{ vars.PRXREF_LLM_REASONING_EFFORT }}
          # Per-WORKER-CHUNK completion budget, not a per-run one: each chunk gets
          # its own call with this ceiling, so raising it does not multiply into a
          # single huge request. It needs a literal fallback where the neighbours
          # above do not, because an unset repository variable renders as the empty
          # string and prxref then falls back to its own default of 4096 — silently
          # restoring the bug. The configured model is a reasoning model, and the
          # hidden reasoning trace is drawn from this same completion budget, so at
          # 4096 the response hit finish_reason=length before the findings JSON was
          # emitted: a real PR reviewed 2 of 4 chunks and posted "Findings may be
          # incomplete". The same PR at 32000 completed 4/4. Override per repo by
          # setting the variable.
          PRXREF_LLM_MAX_TOKENS: ${{ vars.PRXREF_LLM_MAX_TOKENS || '32000' }}
        run: |
          .venv/bin/prxref review --pr-url "${{ github.event.pull_request.html_url }}" -v

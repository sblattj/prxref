[project]
name = "prxref"
version = "0.1.0"
description = "Fast automated AI code review for Bitbucket, GitLab, and GitHub"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stephen Blatt" }]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
ferry = []          # filled by llm backends seat (llm-ferry extra)
litellm = []        # filled by llm backends seat

[project.scripts]
prxref = "prxref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prxref"]

[tool.hatch.build.force-include]
"src/prxref/prompts" = "prxref/prompts"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

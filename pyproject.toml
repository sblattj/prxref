[project]
name = "prxref"
version = "0.2.0"
description = "Fast automated AI code review for Bitbucket, GitLab, and GitHub"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stephen Blatt" }]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/sblattj/prxref"
Repository = "https://github.com/sblattj/prxref"
Issues = "https://github.com/sblattj/prxref/issues"
Changelog = "https://github.com/sblattj/prxref/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
litellm = ["litellm>=1.40"]

[project.scripts]
prxref = "prxref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-Python files under the package dir (prompts/*.md) ship automatically.
# Do NOT use force-include here: it relocates prompts to the sdist root, which
# breaks `uv build` (wheel is built from the sdist, where src/prxref/prompts
# then no longer exists).
packages = ["src/prxref"]

[tool.hatch.build.targets.sdist]
# Explicit allow-list. Hatchling's default sdist sweeps the project root and has
# been observed packaging untracked, gitignored working directories
# (.superpowers/, .research/); an explicit include list cannot regress that way.
include = [
    "src/prxref",
    "tests",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "pyproject.toml",
]
exclude = [
    "docs/superpowers",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts. `-q` lived here and was a trap: pytest ADDS the caller's flags to
# these, so anyone running `pytest -q` (CI does, and so does most muscle memory)
# got `-qq`, which suppresses the "N passed" summary line entirely — a green run
# and a collection-error run look identical. Callers that want quiet pass -q.

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
